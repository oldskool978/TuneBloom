model_metadata:
  name: Furgie-Convergent-48K
  version: 2.0.0
  description: Filterless Complex STFT Generative Super-Resolution Engine.

audio:
  target_sample_rate: 48000
  n_fft: 1024
  hop_length: 512
  win_length: 1024
  power_alpha: 0.2

model:
  dims: [96, 192, 384, 768]
  depths: [2, 2, 4, 2]
  time_dim: 256
  cond_dim: 384
  total_freq_bins: 512
  hr_freq_bins: 432
  feature_enc_layers: 4
  sr_to_lr_bins:
    8: 80
    12: 128
    16: 170
    24: 256

universr_flow_core:
  enabled: true
  repo_id: OLDSKOOL978/universr-audio
  solver: heun
  ode_steps: 16
  guidance_scale: 0.0
  scheduler_type: uniform
  time_warp_gamma: 1.0
  seed: 42
  cross_band_gain_match: true
  crossover_blend_bins: 0
  input_sr_anchor: 24000